plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = project.mod_artifact_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'create'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    maven { url 'https://maven.createmod.net' } // Create, Ponder, Catnip, Flywheel
    maven { url 'https://mvn.devos.one/snapshots' } // Registrate
    maven { url 'https://maven.blamejared.com' } // JEI
    maven { url 'https://maven.theillusivec4.top/' } // Curios API
    maven { url 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' } // NeoForge Config API Port (Ponder)
    maven { url 'https://www.cursemaven.com' }
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    // Create's published metadata lists every optional integration it dev-tests against, so its
    // transitive dependencies are dropped and the ones actually needed are declared explicitly.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    // Catnip ships inside Ponder on 1.21.1
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_github             : mod_github,
            create_version_range   : create_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

tasks.withType(Jar).configureEach {
    from('LICENSE') {
        rename { "${it}_${mod_name}" }
    }
    exclude '.cache'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_artifact_id + '-' + minecraft_version
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}
