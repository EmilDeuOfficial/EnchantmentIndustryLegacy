modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_github}"
logoFile = "pack.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

# This fork carries the same content under its own ids. Running it next to the official mod would
# duplicate every machine and give two parallel, non-interoperable enhanced-experience systems
# (Hyper Experience here, Super Experience there), so the combination is rejected outright.
[[dependencies.${mod_id}]]
modId = "create_enchantment_industry"
type = "incompatible"
reason = "Create: Enchantment Industry Legacy replaces Create: Enchantment Industry - it is the same mod with the older 1.20.1 feature set. Installing both duplicates every machine. Please remove one of them."
ordering = "NONE"
side = "BOTH"
